name: Crypto Signal Bot

on:
  schedule:
    # Every 2 hours at minute 17 (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: scan
        options:
          - scan        # normal analysis + alerts
          - check       # test data sources and Telegram
          - summary     # analysis + force the daily summary now
          - backtest    # test the rules on ~1000 days of history

permissions:
  contents: write   # lets the bot save its memory (state/state.json) and reports

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      MY_HOLDINGS: ${{ vars.MY_HOLDINGS }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode || 'scan' }}"
          case "$MODE" in
            check)    .venv/bin/python check_sources.py ;;
            summary)  .venv/bin/python bot.py --summary ;;
            backtest) .venv/bin/python backtest.py --coins 50 --days 1000 ;;
            *)        .venv/bin/python bot.py ;;
          esac

      - name: Save bot memory and reports
        if: always()
        run: |
          git config user.name "crypto-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state || true
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "bot: update state and reports [skip ci]"
            git pull --rebase --quiet || true
            git push
          fi
